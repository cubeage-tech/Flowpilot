name: CI

on:
  push:
    branches: [develop, 'dev-*']
  pull_request:
    branches: [develop]
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flowpilotfrontend
    steps:
      - uses: actions/checkout@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: flowpilotfrontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flowpilot-backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin
          cache: maven

      - name: Build and test
        run: ./mvnw verify -B
