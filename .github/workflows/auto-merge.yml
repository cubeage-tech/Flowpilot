name: Auto Merge Dev Branches

on:
  push:
    branches:
      - 'dev-*'

permissions:
  contents: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge dev branch
        run: |
          TARGET_BRANCH="develop"
          
          # Fetch all branches explicitly
          git fetch origin "+refs/heads/*:refs/remotes/origin/*"

          # Switch to target branch or create it locally tracking origin
          git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH"
          
          # Merge the pushed dev branch into target branch
          git merge "origin/${{ github.ref_name }}" --no-edit -m "Auto-merge ${{ github.ref_name }} into $TARGET_BRANCH" -X theirs
          
          # Push the merged target branch back to origin
          git push origin "$TARGET_BRANCH"
