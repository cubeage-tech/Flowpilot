name: Create PR to Company Development

on:
  push:
    branches:
      - develop

permissions:
  contents: read

jobs:
  create-pull-request:
    runs-on: ubuntu-latest

    steps:
      - name: Check for existing PR
        id: check_pr
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
        run: |
          RESPONSE=$(curl -sS \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/cubeage-tech/Flowpilot/pulls?state=open&base=develop&head=cubeag-team-five%3Adevelop")

          PR_COUNT=$(echo "$RESPONSE" | jq 'length')

          echo "Existing open PRs: $PR_COUNT"

          if [ "$PR_COUNT" -gt 0 ]; then
            echo "An open PR already exists."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "No open PR exists."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Pull Request
        if: steps.check_pr.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
        run: |
          curl -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/cubeage-tech/Flowpilot/pulls \
            -d '{
              "title": "Development → Company Development",
              "body": "Automatically created PR from cubeag-team-five/Flowpilot develop to cubeage-tech/Flowpilot develop.",
              "head": "cubeag-team-five:develop",
              "base": "develop"
            }'
